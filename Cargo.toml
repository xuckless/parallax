[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["upstream", "build"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14" }
parallax-platform = { path = "crates/platform" }
thiserror = "2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

# GPUI comes from build/gpui-patched/ (generated by scripts/apply-patches.sh). One row per crate in upstream/UPSTREAM.
[patch.crates-io]
gpui-pre                   = { path = "build/gpui-patched/gpui-pre" }
gpui-pre-apple             = { path = "build/gpui-patched/gpui-pre-apple" }
gpui-pre-collections       = { path = "build/gpui-patched/gpui-pre-collections" }
gpui-pre-derive-refineable = { path = "build/gpui-patched/gpui-pre-derive-refineable" }
gpui-pre-http-client       = { path = "build/gpui-patched/gpui-pre-http-client" }
gpui-pre-ios               = { path = "build/gpui-patched/gpui-pre-ios" }
gpui-pre-linux             = { path = "build/gpui-patched/gpui-pre-linux" }
gpui-pre-macos             = { path = "build/gpui-patched/gpui-pre-macos" }
gpui-pre-macros            = { path = "build/gpui-patched/gpui-pre-macros" }
gpui-pre-platform          = { path = "build/gpui-patched/gpui-pre-platform" }
gpui-pre-refineable        = { path = "build/gpui-patched/gpui-pre-refineable" }
gpui-pre-scheduler         = { path = "build/gpui-patched/gpui-pre-scheduler" }
gpui-pre-shared-string     = { path = "build/gpui-patched/gpui-pre-shared-string" }
gpui-pre-sum-tree          = { path = "build/gpui-patched/gpui-pre-sum-tree" }
gpui-pre-util              = { path = "build/gpui-patched/gpui-pre-util" }
gpui-pre-web               = { path = "build/gpui-patched/gpui-pre-web" }
gpui-pre-wgpu              = { path = "build/gpui-patched/gpui-pre-wgpu" }
gpui-pre-windows           = { path = "build/gpui-patched/gpui-pre-windows" }
gpui-pre-ztracing          = { path = "build/gpui-patched/gpui-pre-ztracing" }
gpui-pre-ztracing-macro    = { path = "build/gpui-patched/gpui-pre-ztracing-macro" }
