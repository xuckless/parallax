[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]
exclude = ["upstream", "build"]

[workspace.package]
authors = ["Syed Ali (xuckless)"]
version = "0.1.8"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/xuckless/parallax"

[workspace.dependencies]
gpui = { package = "parallax-gpui", version = "=0.3.14-parallax.10" }
# No default features: `multithreaded` (gpui_web threads) needs nightly and affects only wasm32. See AGENTS.md, Web threading.
# `wayland` and `x11` are off by default upstream; without them Linux starts headless and draws nothing.
# `font-kit` is off by default upstream too; without it macOS uses GPUI's NoopTextSystem and draws no text.
gpui_platform = { package = "parallax-gpui-platform", version = "=0.3.14-parallax.10", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_wgpu = { package = "parallax-gpui-wgpu", version = "=0.3.14-parallax.10" }
parallax-android = { path = "crates/android", version = "0.1.8" }
parallax-platform = { path = "crates/platform", version = "0.1.8" }
thiserror = "2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

# Our GPUI fork comes from build/parallax-gpui/ (generated by scripts/apply-patches.sh). One row per crate in
# upstream/UPSTREAM, named by the rule in scripts/fork-crates.sh. Versions: patches/FORK_REVISION.
# Cargo warns "patch ... was not used" for parallax-gpui-bench-metrics and -zlog: they are optional deps no feature we
# enable pulls in. The rows stay so turning such a feature on builds the local fork, not crates.io; cargo has no
# per-row silence, and dropping rows by graph would make the row set depend on features.
[patch.crates-io]
parallax-gpui                   = { path = "build/parallax-gpui/parallax-gpui" }
parallax-gpui-apple             = { path = "build/parallax-gpui/parallax-gpui-apple" }
parallax-gpui-bench-metrics     = { path = "build/parallax-gpui/parallax-gpui-bench-metrics" }
parallax-gpui-collections       = { path = "build/parallax-gpui/parallax-gpui-collections" }
parallax-gpui-derive-refineable = { path = "build/parallax-gpui/parallax-gpui-derive-refineable" }
parallax-gpui-http-client       = { path = "build/parallax-gpui/parallax-gpui-http-client" }
parallax-gpui-ios               = { path = "build/parallax-gpui/parallax-gpui-ios" }
parallax-gpui-linux             = { path = "build/parallax-gpui/parallax-gpui-linux" }
parallax-gpui-macos             = { path = "build/parallax-gpui/parallax-gpui-macos" }
parallax-gpui-macros            = { path = "build/parallax-gpui/parallax-gpui-macros" }
parallax-gpui-platform          = { path = "build/parallax-gpui/parallax-gpui-platform" }
parallax-gpui-refineable        = { path = "build/parallax-gpui/parallax-gpui-refineable" }
parallax-gpui-scheduler         = { path = "build/parallax-gpui/parallax-gpui-scheduler" }
parallax-gpui-shared-string     = { path = "build/parallax-gpui/parallax-gpui-shared-string" }
parallax-gpui-sum-tree          = { path = "build/parallax-gpui/parallax-gpui-sum-tree" }
parallax-gpui-util              = { path = "build/parallax-gpui/parallax-gpui-util" }
parallax-gpui-web               = { path = "build/parallax-gpui/parallax-gpui-web" }
parallax-gpui-wgpu              = { path = "build/parallax-gpui/parallax-gpui-wgpu" }
parallax-gpui-windows           = { path = "build/parallax-gpui/parallax-gpui-windows" }
parallax-gpui-zlog              = { path = "build/parallax-gpui/parallax-gpui-zlog" }
parallax-gpui-ztracing          = { path = "build/parallax-gpui/parallax-gpui-ztracing" }
parallax-gpui-ztracing-macro    = { path = "build/parallax-gpui/parallax-gpui-ztracing-macro" }
