# cargo parallax reads this on every target (docs/getting-started.md; keys: docs/cli.md). Every other key keeps its
# default. What each target shows: README.md.
[app]
name = "Native views"
id = "io.github.xuckless.parallax.nativeview"
icon = "../../assets/brand/parallax-app-icon.svg"

[android]
abis = ["x86_64"]

# The page makes the views' elements and the iframes load frame.html (docs/native-view-web-checks.md).
[web]
index = "index.html"
assets = ["frame.html"]
