[package]
name = "native-view-windows"
description = "Parallax example: a NativeView on Windows, a composition swap chain the app presents to every frame under GPUI's content, with a div over part of it."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
# Examples are never published.
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
log = "0.4"
parallax = { path = "../../crates/parallax" }

[target.'cfg(not(any(target_os = "android", target_family = "wasm")))'.dependencies]
env_logger = "0.11"

# The windows crate version gpui_windows uses, so the example adds no second copy.
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]
