[package]
name = "hello"
description = "Parallax example: one window with a box that changes colour on tap, on every target."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
# Examples are never published.
publish = false

[lints]
workspace = true

# cdylib: the Android .so (android_main!) and the web .wasm. rlib: for the desktop bin in main.rs.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
log = "0.4"
parallax = { path = "../../crates/parallax" }

# The #[wasm_bindgen(start)] attribute that starts the app in the browser.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2.120"
