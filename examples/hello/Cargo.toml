[package]
name = "hello"
description = "Parallax example: one window with a text field, a multi-script line and a box that changes colour on tap, on every target."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
# Examples are never published.
publish = false

[lints]
workspace = true

# cdylib: the Android .so (android_main!) and the web .wasm. rlib: for the desktop bin in main.rs.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
log = "0.4"
parallax = { path = "../../crates/parallax" }
# Grapheme boundaries for the text field's cursor moves and deletes (src/text_field.rs).
unicode-segmentation = "1"

# The #[wasm_bindgen(start)] attribute that starts the app in the browser.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2.120"

# Desktop and iOS log to stderr (main.rs); Android logs to logcat and the web to the console (lib.rs).
[target.'cfg(not(any(target_os = "android", target_family = "wasm")))'.dependencies]
env_logger = "0.11"
