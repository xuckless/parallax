[package]
name = "native-view-web"
description = "Parallax example: DOM elements (two iframes, an animated canvas) shown through a GPUI canvas as NativeViews (docs/native-view-web.md)."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
# Examples are never published.
publish = false

[lints]
workspace = true

# cdylib: the web .wasm. rlib: so the workspace builds it (empty) on the host.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
log = "0.4"
parallax = { path = "../../crates/parallax" }

# The #[wasm_bindgen(start)] entry, the page's elements (index.html makes them) and the frame counter it reads.
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2.120"
web-sys = { version = "0.3", features = ["HtmlElement", "Window"] }
web-time = "1.1"
