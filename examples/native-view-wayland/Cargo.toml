[package]
name = "native-view-wayland"
description = "Parallax example: an app-owned Wayland surface shown through a GPUI window as a NativeView (docs/native-view-wayland.md)."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
# Examples are never published.
publish = false

[lints]
workspace = true

[dependencies]
log = "0.4"
parallax = { path = "../../crates/parallax" }

# The page: its own event queue on GPUI's Wayland connection, an shm pool, one wl_surface.
[target.'cfg(target_os = "linux")'.dependencies]
env_logger = "0.11"
# `NativeViewBuffers`: how the page commits its buffers to the view (patch 0049).
gpui_linux.workspace = true
libc = "0.2"
raw-window-handle = "0.6"
wayland-backend = { version = "0.3.15", features = ["client_system"] }
wayland-client = "0.31.11"
