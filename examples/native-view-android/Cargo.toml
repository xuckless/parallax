[package]
name = "native-view-android"
description = "Parallax example: an app-fed surface and a WebView shown through a GPUI window as NativeViews on Android (docs/native-view-android.md)."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
# Examples are never published.
publish = false

[lints]
workspace = true

# cdylib: the Android .so (android_main!). Off Android the crate is empty.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
log = "0.4"
parallax = { path = "../../crates/parallax" }

# The surface's producer fills an ANativeWindow from its own thread.
[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.6"
