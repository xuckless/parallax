[package]
name = "touch-inject"
description = "Dev-only: injects synthetic touch, pen and mouse input into a window on Windows, for Parallax's desktop touch traces and checks."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
# A test tool for scripts/record-traces.sh and scripts/touch-checks.sh (docs/desktop-touch-windows.md); never published.
publish = false

[lints]
workspace = true

# The windows crate version gpui_windows uses, so the harness adds no second copy.
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
]
