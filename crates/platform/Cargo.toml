[package]
name = "parallax-platform"
description = "Picks the GPUI platform for the current target (desktop, web, iOS, Android) from one table."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gpui", "gui", "cross-platform", "android", "wasm"]
categories = ["gui"]

[lints]
workspace = true

[dependencies]
gpui.workspace = true
thiserror.workspace = true

# Upstream gpui_platform has no Android arm and does not compile there; Android's backend is parallax-android.
[target.'cfg(not(target_os = "android"))'.dependencies]
gpui_platform.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
parallax-android.workspace = true
