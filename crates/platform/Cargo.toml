[package]
name = "parallax-platform"
description = "Picks the GPUI platform for the current target (desktop, web, iOS, Android) from one table."
version.workspace = true
authors.workspace = true
edition.workspace = true
license = "Apache-2.0 AND BSD-3-Clause"
repository.workspace = true
readme = "README.md"
keywords = ["gpui", "gui", "cross-platform", "android", "wasm"]
categories = ["gui"]

[lints]
workspace = true

[dependencies]
gpui.workspace = true
thiserror.workspace = true

# Upstream gpui_platform has no Android arm and does not compile there; Android's backend is parallax-android.
[target.'cfg(not(target_os = "android"))'.dependencies]
gpui_platform.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
parallax-android.workspace = true

# The behaviour table reads navigator.platform, userAgent and maxTouchPoints to pick the browser host OS's row.
[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["Navigator", "Window"] }

# The trace replay test (tests/trace_replay.rs) drives GPUI's test platform.
[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
