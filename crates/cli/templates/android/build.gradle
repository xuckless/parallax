// Generated by cargo-parallax from crates/cli/templates/android/build.gradle. Rewritten every run.
// AGP 9.3.1 matches Flutter's engine test_runner, where the ported Robolectric tests come from.
// The release signingConfigs block is adapted from Flutter's Android deployment guide (flutter/website
// sites/docs/src/content/deployment/android.md @ 7c32e59, BSD-3-Clause code samples, see NOTICE), the release
// buildType's R8 settings from flutter/flutter packages/flutter_tools/gradle/src/main/kotlin/FlutterPlugin.kt @ 3.50.1.
// Copyright 2014 The Flutter Authors. BSD-3-Clause, see third_party/flutter/LICENSE.
plugins {
    id 'com.android.application' version '9.3.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

android {
    namespace = '{{id}}'
    compileSdk = {{target_sdk}}
    // AGP strips the Rust .so files with this NDK's llvm-strip.
    ndkPath = '{{ndk_dir}}'
    ndkVersion = '{{ndk_version}}'

    defaultConfig {
        applicationId = '{{id}}'
        minSdk = {{min_sdk}}
        targetSdk = {{target_sdk}}
        // app.version and android.version_code in parallax.toml.
        versionCode = {{version_code}}
        versionName = '{{version}}'
    }

    // Flutter's key.properties values, from parallax.toml's [android.release] instead. The passwords are never in a
    // file: cargo-parallax passes them in the environment of the Gradle run that signs (docs/cli-android-release.md).
    signingConfigs {
        release {
            keyAlias = {{key_alias}}
            keyPassword = System.getenv('PARALLAX_KEY_PASSWORD')
            storeFile = {{store_file}}
            storePassword = System.getenv('PARALLAX_KEYSTORE_PASSWORD')
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.release
            // As Flutter's Gradle plugin sets up every release build: R8 shrinks the code and the resources.
            minifyEnabled = true
            shrinkResources = true
            // proguard-rules.pro: Flutter's rules; the last file keeps the Java that Rust calls over JNI.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', '{{android_rules}}'
        }
    }

    sourceSets {
        main {
            // The Activity and the ported Flutter embedding, from the parallax-android crate.
            java.srcDirs = ['{{java_dir}}']
        }
    }
}
