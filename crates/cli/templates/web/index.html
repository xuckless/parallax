<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!--
    viewport-fit=cover lays the app out underneath the parts of the screen that
    the device obstructs, such as a display cutout, the rounded corners of the
    screen, or a home indicator. GPUI reads env(safe-area-inset-*) and reports
    them as the window's safe area, so the app keeps its own content out of the
    way. user-scalable=0: pinches go to the app, not the browser's zoom.
  -->
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="{{title}}">
  <meta name="theme-color" content="{{background}}">
{{icon_links}}
  <title>{{title}}</title>
  <link rel="manifest" href="manifest.json">

  <!-- gpui_web appends its own full-page canvas to <body>; the background shows until its first frame. -->
  <style>html, body { margin: 0; height: 100%; overflow: hidden; background: {{background}}; }</style>
</head>
<body>
  <script type="module">
    // wasm-bindgen's loader (pkg/, written by cargo parallax); init() fetches the .wasm and runs the app's
    // #[wasm_bindgen(start)] function.
    import init from "./pkg/{{lib}}.js";
    init();
  </script>
</body>
</html>
