[package]
name = "cargo-parallax"
description = "cargo parallax: build and run GPUI apps on Android and iOS from parallax.toml."
version.workspace = true
authors.workspace = true
edition.workspace = true
# templates/ port Flutter's app templates (BSD-3-Clause, LICENSE-FLUTTER).
license = "Apache-2.0 AND BSD-3-Clause"
repository.workspace = true
readme = "README.md"
keywords = ["gpui", "android", "cargo", "cli", "mobile"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
# templates/ (Gradle project and wrapper jar) are compiled in with include_str!/include_bytes!, so they ship too.

[lints]
workspace = true

[dependencies]
anyhow = "1"
# Same version GPUI uses; tiny-skia's default `png-format` encodes the launcher PNGs.
resvg = { version = "0.46.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
toml = "1"
