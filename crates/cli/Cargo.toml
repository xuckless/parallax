[package]
name = "cargo-parallax"
description = "cargo parallax: build and run GPUI apps on Android from parallax.toml (iOS and web later)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gpui", "android", "cargo", "cli", "mobile"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
# templates/ (Gradle project and wrapper jar) are compiled in with include_str!/include_bytes!, so they ship too.

[lints]
workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
toml = "1"
