[package]
name = "parallax-android"
description = "GPUI Platform and PlatformWindow for Android, built on Flutter's ported Android embedding: wgpu on Vulkan with a GL fallback."
version.workspace = true
authors.workspace = true
edition.workspace = true
license = "Apache-2.0 AND BSD-3-Clause"
repository.workspace = true
readme = "README.md"
keywords = ["gpui", "android", "gui", "jni", "touch"]
categories = ["gui", "os::android-apis"]
# java/ (ParallaxActivity and the ported Flutter embedding) ships in the package: cargo-parallax compiles it from
# wherever cargo metadata puts this crate, crates.io included.
# java-tests/ (the JVM test project, docs/android-tests.md) does not.
exclude = ["java-tests/"]

[lints]
workspace = true

# Off Android the crate is only the `android_main!` macro (it expands to nothing there), so apps build for every target.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
anyhow = "1"
# Only to read family names from the few font files the fallback table names (src/text_system.rs).
fontdb = { version = "0.23", default-features = false, features = ["std"] }
futures = "0.3"
gpui.workspace = true
gpui_wgpu.workspace = true
jni = "0.21"
libc = "0.2"
log = "0.4"
# System fonts are memory-mapped, not read into RAM (src/text_system.rs).
memmap2 = "0.9"
ndk-sys = "0.6"
raw-window-handle = "0.6"
roxmltree = "0.21"
# For src/queue.rs, the local copy of upstream's priority queue; features as upstream gpui needs for it.
rand = { version = "0.9", default-features = false, features = ["std", "small_rng"] }
thiserror.workspace = true
uuid = "1"

# The pure modules (surface state machine, pointer packet decoder, fonts.xml parser) are tested on the host.
[dev-dependencies]
gpui.workspace = true
rand = { version = "0.9", default-features = false, features = ["std", "small_rng"] }
roxmltree = "0.21"
thiserror.workspace = true
