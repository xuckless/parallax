# Six builds, one per target, no feature variants (ROADMAP Phase 0). See docs/ci.md.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # System libraries gpui_linux links (wayland, x11/xcb, xkbcommon, fontconfig, freetype); subset of Zed's script/linux.
  LINUX_PACKAGES: libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
  # The library crates published to crates.io. `cargo package` builds each from its packaged tarball against
  # crates.io gpui-pre, without the workspace [patch] (AGENTS.md patch rule 11). Add a row when a crate goes public.
  PUBLISHED_LIBS: -p parallax-android -p parallax-platform -p parallax

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One row per target. To add a target: add a row here and its rustup target in rust-toolchain.toml.
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
            checks: |
              cargo fmt --all --check
              cargo clippy --workspace --all-targets -- -D warnings
              cargo test --workspace
              cargo package $PUBLISHED_LIBS -p cargo-parallax
          - target: windows
            os: windows-latest
            checks: |
              cargo clippy --workspace --all-targets -- -D warnings
              cargo test --workspace
          - target: macos
            os: macos-latest
            checks: |
              cargo clippy --workspace --all-targets -- -D warnings
              cargo test --workspace
          - target: ios
            os: macos-latest
            checks: |
              cargo check --workspace --target aarch64-apple-ios
              cargo check --workspace --target aarch64-apple-ios-sim
          - target: android
            os: ubuntu-latest
            checks: |
              ndk_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
              export CC_aarch64_linux_android="$ndk_bin/aarch64-linux-android28-clang"
              export AR_aarch64_linux_android="$ndk_bin/llvm-ar"
              export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ndk_bin/aarch64-linux-android28-clang"
              cargo check --workspace --target aarch64-linux-android
              cargo package $PUBLISHED_LIBS --target aarch64-linux-android
          - target: wasm
            os: ubuntu-latest
            checks: |
              cargo check --workspace --target wasm32-unknown-unknown
              cargo package $PUBLISHED_LIBS --target wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v7.0.1
      # rustup reads channel, components and targets from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      # build/ is generated, never committed: every job rebuilds build/gpui-patched from upstream/ + patches/.
      - run: scripts/apply-patches.sh
      - run: ${{ matrix.checks }}
