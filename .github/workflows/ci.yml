# Six builds, one per target, no feature variants (ROADMAP Phase 0), and the Java tests. See docs/ci.md.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # System libraries gpui_linux links (wayland, x11/xcb, xkbcommon, fontconfig, freetype); subset of Zed's script/linux.
  LINUX_PACKAGES: libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
  # The library crates published to crates.io. `cargo package` builds each from its packaged tarball against the
  # parallax-gpui* fork crates on crates.io, without the workspace [patch] (docs/ci.md). Add a row when a crate goes public.
  PUBLISHED_LIBS: -p parallax-android -p parallax-platform -p parallax

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One row per target. To add a target: add a row here and its rustup target in rust-toolchain.toml.
      # package_target: the target the published libraries are packaged for (none: not packaged on this row).
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
            checks: |
              cargo fmt --all --check
              cargo clippy --workspace --all-targets -- -D warnings
              cargo test --workspace
              cargo package -p cargo-parallax
              scripts/publish-fork.sh --dry-run
            package_target: x86_64-unknown-linux-gnu
          - target: windows
            os: windows-latest
            checks: |
              cargo clippy --workspace --all-targets -- -D warnings
              cargo test --workspace
          - target: macos
            os: macos-latest
            checks: |
              cargo clippy --workspace --all-targets -- -D warnings
              cargo test --workspace
          - target: ios
            os: macos-latest
            checks: |
              cargo check --workspace --target aarch64-apple-ios
              cargo check --workspace --target aarch64-apple-ios-sim
          - target: android
            os: ubuntu-latest
            checks: |
              cargo clippy --workspace --all-targets --target aarch64-linux-android -- -D warnings
            package_target: aarch64-linux-android
          - target: wasm
            os: ubuntu-latest
            checks: |
              cargo check --workspace --target wasm32-unknown-unknown
            package_target: wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v7.0.1
      # rustup reads channel, components and targets from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      # The NDK's clang as C compiler and linker, for this step and every later one.
      - if: matrix.target == 'android'
        run: |
          ndk_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$ndk_bin/aarch64-linux-android28-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ndk_bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ndk_bin/aarch64-linux-android28-clang" >> "$GITHUB_ENV"
      # build/ is generated, never committed: every job rebuilds it (patched GPUI + fork crates) from upstream/ + patches/.
      - run: scripts/apply-patches.sh
      - run: ${{ matrix.checks }}
      # The published libraries resolve parallax-gpui* from crates.io, so they package only once the pinned fork
      # version is published (docs/gpui-fork-crates.md#publishing). Not yet published: a warning on pull requests and
      # other branches, a failure on main and release tags (v*). publish-fork.sh exits 1 for "not published"; any other
      # non-zero exit is an error and fails the job.
      - if: matrix.package_target
        env:
          REQUIRE_FORK: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          status=0
          scripts/publish-fork.sh --published || status=$?
          case $status in
            0) cargo package $PUBLISHED_LIBS --target ${{ matrix.package_target }} ;;
            1)
              if [[ $REQUIRE_FORK == true ]]; then
                echo "::error::the pinned parallax-gpui* version is not on crates.io; publish it first (docs/gpui-fork-crates.md)"
                exit 1
              fi
              echo "::warning::the pinned parallax-gpui* version is not on crates.io yet; published libraries not packaged" ;;
            *) exit "$status" ;;
          esac

  # JVM tests of the ported Android Java (docs/android-tests.md). No Rust or build/, so a job of its own.
  java-tests:
    name: java-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # JDK 21: Robolectric needs it for SDK 37. `cache: gradle` keeps Gradle's caches and wrapper.
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 21.0.13+9
          cache: gradle
      # Robolectric's android-all jars (one per emulated SDK, ~1.5 GB) download outside Gradle's cache.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('crates/android/java-tests/build.gradle') }}
      # The runner's Android SDK (ANDROID_HOME); Gradle fetches platforms;android-37 into it.
      - run: scripts/java-test.sh
